# cargo-release workspace 配置
# https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md
#
# 注意：独立的 release.toml 不使用 [workspace] / [[package]] 表头——
# workspace 根的 release.toml 顶层键即为 workspace 级配置，
# 包级配置放在各包目录自己的 release.toml 里
# （crates/codelens-core/release.toml、crates/codelens/release.toml）。

# 只允许在 rust 分支发版
allow-branch = ["rust"]
# crates.io 发布由 CI 的 publish-crates job 负责（本地无发布凭证），
# cargo release 只做版本 bump、文件替换、提交、打 tag、推送
publish = false
# workspace 所有成员合并为一次发布提交
consolidate-commits = true
# 默认不发布任何包；各包在自己的 release.toml 里显式开启，
# 防止未来新增的 crate 被意外发布
release = false
# 默认不打 tag，由 codelens 包统一打 v{{version}}-rust（见其 release.toml）
tag = false
sign-tag = false
sign-commit = false

# 发布提交消息
pre-release-commit-message = "chore: release v{{version}}"
