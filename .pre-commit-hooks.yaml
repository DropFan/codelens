# pre-commit hooks for codelens (https://pre-commit.com)
#
# Usage in a consuming repo's .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/DropFan/codelens
#       rev: v0.1.5-rust
#       hooks:
#         - id: codelens-health
#           args: ['--fail-under', 'C']
#
# `language: rust` lets pre-commit build codelens from this repo via
# cargo; teams that prefer prebuilt binaries can use a local hook with
# `language: system` pointing at an installed codelens instead.

- id: codelens-health
  name: codelens health gate
  description: Fail the commit when project code health is below a threshold.
  entry: codelens health
  args: ['--fail-under', 'C']
  language: rust
  pass_filenames: false
  types: [text]

- id: codelens-stats
  name: codelens statistics
  description: Print code statistics for the repository (informational).
  entry: codelens
  language: rust
  pass_filenames: false
  verbose: true
  types: [text]
