# pre-commit hooks for codelens (https://pre-commit.com)
#
# These hooks use `language: system`: install codelens first
# (`brew install DropFan/tap/codelens` or `cargo install codelens`).
# `language: rust` is not an option here because the repository root is
# a virtual cargo workspace, which `cargo install --path .` rejects.
#
# Usage in a consuming repo's .pre-commit-config.yaml (rev must be a
# tag that contains this manifest, v0.1.6-rust or newer):
#
#   repos:
#     - repo: https://github.com/DropFan/codelens
#       rev: v0.1.8-rust
#       hooks:
#         - id: codelens-health
#           args: ['--fail-under', 'C']

- id: codelens-health
  name: codelens health gate
  description: Fail the commit when project code health is below a threshold (requires codelens on PATH).
  entry: codelens health
  args: ['--fail-under', 'C']
  language: system
  pass_filenames: false
  types: [text]

- id: codelens-stats
  name: codelens statistics
  description: Print code statistics for the repository (informational, requires codelens on PATH).
  entry: codelens
  language: system
  pass_filenames: false
  verbose: true
  types: [text]
