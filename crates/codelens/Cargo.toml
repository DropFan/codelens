[package]
name = "codelens"
description = "High performance code analysis tool — stats, health scores, hotspots, and trends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "codelens"
path = "src/main.rs"

[features]
default = ["mcp"]
# MCP server mode (`codelens mcp`); drags in tokio, so it can be
# disabled with --no-default-features for a leaner binary.
mcp = ["dep:rmcp", "dep:tokio", "dep:serde", "dep:serde_json"]

[dependencies]
codelens-core = { version = "0.1.1", path = "../codelens-core" }

# MCP server (optional)
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# CLI
clap.workspace = true

# Error handling
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Output
colored.workspace = true
indicatif.workspace = true

# Utilities
chrono.workspace = true
num_cpus.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
