    { start = '"', end = '"', escape = "\\" },
    { start = "'", end = "'" },
]

[fish]
name = "Fish"
extensions = [".fish"]
line_comments = ["#"]
function_pattern = "(?m)^\\s*function\\s+\\w+"
complexity_keywords = ["if", "else", "for", "while", "switch", "case", "and", "or"]

[powershell]
name = "PowerShell"
extensions = [".ps1", ".psm1", ".psd1"]
